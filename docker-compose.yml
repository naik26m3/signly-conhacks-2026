services:
  api:
    build: ./backend
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/
    volumes:
      - ./backend:/app
      - ./models:/models
      - ./debug:/debug
    depends_on:
      - postgres
      - redis
      - seaweedfs-master
      - seaweedfs-volume
      - seaweedfs-filer
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aslbridge
      POSTGRES_USER: aslbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs
    command: master -ip=seaweedfs-master
    ports:
      - "9333:9333"
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -ip=seaweedfs-volume
    volumes:
      - seaweedfs_data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs
    command: filer -master=seaweedfs-master:9333
    ports:
      - "18888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m arq worker.WorkerSettings
    env_file:
      - .env
    environment:
      - PYTHONPATH=/
    volumes:
      - ./backend:/app
      - ./models:/models
      - ./debug:/debug
    depends_on:
      - redis
      - seaweedfs-filer
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  grafana_data:
