services:
  api:
    build: ./backend
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/
    volumes:
      - ./backend:/app
      - ./models:/models
      - ./debug:/debug
    depends_on:
      - postgres
      - redis
      - seaweedfs-master
      - seaweedfs-volume
      - seaweedfs-filer
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aslbridge
      POSTGRES_USER: aslbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs
    command: master -ip=seaweedfs-master
    ports:
      - "9333:9333"
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -ip=seaweedfs-volume
    volumes:
      - seaweedfs_data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs
    command: filer -master=seaweedfs-master:9333
    ports:
      - "18888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
